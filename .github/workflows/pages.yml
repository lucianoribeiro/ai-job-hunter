name: Publish AI Job Hunter Premium (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 10 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-job-hunter-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          python -m unittest discover -s tests -v 2>&1 | tee diagnostics/unit-tests.log
      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-test-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
      - name: Collect only publicly listed jobs
        env:
          CAREER_APP_URL: ${{ vars.CAREER_APP_URL }}
        run: |
          mkdir -p data site
          python -m src.project_jobs_poc --config config/project_boards.example.json --output data/project_jobs_poc.json
          python -m src.hunter
          python -m src.job_history
          python -m src.strategic_companies
          python -m src.regional_ats_qa --output data/regional_qa_jobs.json
          python -m src.himalayas_jobs --output data/himalayas_jobs.json
          python -m src.recruiter_monitor
          python -m src.linkedin_history
          python -m src.unified_jobs_dashboard --projects data/project_jobs_poc.json --qa data/jobs.csv --output site/index.html
      - name: Generate Monica opportunity assessments (private profile optional)
        env:
          MONICA_PROFILE_JSON: ${{ secrets.MONICA_PROFILE_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          if [ -n "${MONICA_PROFILE_JSON:-}" ]; then
            profile_path="$(mktemp)"
            trap 'rm -f "$profile_path"' EXIT
            chmod 600 "$profile_path"
            printf '%s' "$MONICA_PROFILE_JSON" > "$profile_path"
            python -m src.monica_pipeline --check-links --profile "$profile_path" --projects data/project_jobs_poc.json --output site/monica-opportunities.json
          else
            echo 'No private Monica profile configured; publishing empty information page.'
            printf '{"profile_id":"monica","jobs":[],"privacy":"public_job_metadata_only"}\n' > site/monica-opportunities.json
          fi
          python -m src.monica_page --input site/monica-opportunities.json --output site/monica.html
          python -m src.monica_embed --dashboard site/index.html --feed site/monica-opportunities.json
          cp src/monica_bell.js site/monica_bell.js
          python - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          text=p.read_text(encoding='utf-8')
          assert 'id="monica-bell"' in text
          text=text.replace('</body>', '<script src="monica_bell.js" defer></script></body>', 1)
          p.write_text(text,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          html = Path("site/index.html")
          page = html.read_text(encoding="utf-8")
          anchor = '<a href="monica.html" style="position:fixed;bottom:18px;right:18px;z-index:1000;background:#164a68;color:#fff;padding:12px 16px;border-radius:12px;text-decoration:none;box-shadow:0 4px 20px #0007">Carreira Mônica · CV × Vagas</a>'
          if '</body>' in page:
              page=page.replace('</body>',anchor+'</body>',1)
          else:
              page+=anchor
          html.write_text(page,encoding="utf-8")
          PY
          # Public endpoint only; no API credentials are injected into HTML.
          AI_MATCH_API_URL="${{ vars.AI_MATCH_API_URL }}" python - <<'PY'
          import json, os, re
          from pathlib import Path
          # Verified public Workers endpoint; repository variable can override it.
          url = (os.getenv('AI_MATCH_API_URL', '').strip() or 'https://ai-job-hunter-match.lucianopinheiroribeiro.workers.dev').rstrip('/')
          if url and not re.fullmatch(r'https://[a-z0-9.-]+\.workers\.dev', url, re.I):
              raise ValueError('AI_MATCH_API_URL must be an HTTPS workers.dev host')
          path = Path('site/index.html')
          page = path.read_text(encoding='utf-8')
          page = page.replace('<script>', '<script>window.AI_MATCH_API_URL = '+json.dumps(url)+';</script><script>', 1)
          assert 'window.AI_MATCH_API_URL = '+json.dumps(url)+';' in page
          path.write_text(page, encoding='utf-8')
          PY
          test -s site/index.html
          # Verify the generated public artifact, not just the Python source.
          python - <<'PY'
          from pathlib import Path
          from src.unified_jobs_dashboard import studio_job_label
          title = '[2WP] 二輪&パワースポーツ ECU プロジェクトマネジャー/ECU Project Manager for Two Wheeler & Powersports'
          assert studio_job_label(title) == 'ECU Project Manager for Two Wheeler & Powersports'
          page = Path('site/index.html').read_text(encoding='utf-8')
          table = page.split('<tbody>', 1)[1].split('</tbody>', 1)[0]
          assert '二輪' not in table and 'プロジェクトマネジャー' not in table, 'Unnormalized CJK vacancy title in published HTML'
          print('Validated display titles in generated public HTML')
          PY
          python -m src.municipal_jobs --dashboard site/index.html --output data/municipal_jobs.json
          grep -q 'id="municipal-jobs"' site/index.html
          grep -q 'AI Career Studio' site/index.html
          grep -q 'DASHBOARD PREMIUM' site/index.html
          grep -q 'id="regionalCompany"' site/index.html
          grep -q 'id="regionalCards"' site/index.html
          grep -q 'id="monica-inline"' site/index.html
          grep -q 'id="market-recruiter-current"' site/index.html
          grep -q 'id="mainTabFinance"' site/index.html
          grep -q 'id="mainPanelFinance"' site/index.html
          grep -q 'id="mainTabRecruiter"' site/index.html
          grep -q 'id="mainPanelRecruiter"' site/index.html
          grep -q 'id="careerHubCV"' site/index.html
          grep -q 'id="careerHubApplications"' site/index.html
          grep -q 'id="careerHubApplicationsPanel"' site/index.html
          grep -q 'id="usdFilter"' site/index.html
          grep -q 'id="fc-salary"' site/index.html
          grep -q 'Ver informações da vaga' src/unified_jobs_dashboard.py
          test ! -e site/.env
          touch site/.nojekyll
      # GitHub Pages artifacts do not persist files for the next workflow run.
      # Save only public, deduplicated historical data back to main.
      # Pushes made with GITHUB_TOKEN do not recursively trigger this workflow.
      - name: Persist public history on main
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the freshly collected rows independently from the checkout.
          mkdir -p /tmp/ai-job-hunter-history
          cp data/history.json /tmp/ai-job-hunter-history/history.json
          cp data/linkedin_history.json /tmp/ai-job-hunter-history/linkedin_history.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another workflow or a user can push to main during collection.
          # Always start from the latest remote main and MERGE histories by identity.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from pathlib import Path
          for name in ("history.json", "linkedin_history.json"):
              latest_path = Path("data") / name
              collected_path = Path("/tmp/ai-job-hunter-history") / name
              latest = json.loads(latest_path.read_text(encoding="utf-8")) if latest_path.exists() else {}
              collected = json.loads(collected_path.read_text(encoding="utf-8"))
              merged = dict(latest)
              for key, record in collected.items():
                  if not isinstance(record, dict):
                      continue
                  previous = merged.get(key, {})
                  if not isinstance(previous, dict):
                      previous = {}
                  combined = {**previous, **record}
                  if previous.get("first_seen") and record.get("first_seen"):
                      combined["first_seen"] = min(previous["first_seen"], record["first_seen"])
                  if previous.get("last_seen") and record.get("last_seen"):
                      combined["last_seen"] = max(previous["last_seen"], record["last_seen"])
                  merged[key] = combined
              latest_path.parent.mkdir(parents=True, exist_ok=True)
              latest_path.write_text(json.dumps(merged, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print(f"{name}: retained {len(merged)} records")
          PY
            git add -- data/history.json data/linkedin_history.json
            if git diff --cached --quiet; then
              echo "Histories already up-to-date on main."
              break
            fi
            git commit -m "data: retain collected job and LinkedIn history [skip ci]"
            if git push origin HEAD:main; then
              echo "Historical JSON files saved to main."
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Could not persist history after 5 synchronization attempts"
              exit 1
            fi
            echo "main moved during push; retrying after merging latest history."
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
