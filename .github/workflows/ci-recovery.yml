name: AI Job Hunter Recovery Agent
on:
  workflow_run:
    workflows:
      - Publish AI Job Hunter Premium (GitHub Pages)
    types: [completed]
permissions:
  contents: read
  actions: write
  issues: write
jobs:
  investigate:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose failure and perform bounded recovery
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate --jq '.jobs[] | select(.conclusion == "failure") | .id' > diagnostics/failed-job-ids.txt
          : > diagnostics/failure.log
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            gh api "repos/$REPO/actions/jobs/$id/logs" > "diagnostics/job-$id.log" || true
            tail -n 1200 "diagnostics/job-$id.log" >> diagnostics/failure.log
          done < diagnostics/failed-job-ids.txt
          python -m src.ci_recovery < diagnostics/failure.log > diagnostics/decision.json
          cat diagnostics/decision.json
          action="$(python -c 'import json;print(json.load(open("diagnostics/decision.json"))["action"])')"
          kind="$(python -c 'import json;print(json.load(open("diagnostics/decision.json"))["kind"])')"
          if [ "$action" = "retry_once" ] && [ "$RUN_ATTEMPT" = "1" ]; then
            echo "Transient failure. Re-running once only."
            gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
            exit 0
          fi
          title="[CI Recovery] Build $RUN_ID failed ($kind)"
          existing="$(gh issue list --state all --search "$title in:title" --json title --jq '[.[] | select(.title == "'"$title"'")] | length')"
          if [ "$existing" = "0" ]; then
            {
              echo "Automated diagnosis of failed deployment."
              echo
              echo "Run: $RUN_URL"
              echo "Attempt: $RUN_ATTEMPT"
              echo "Classification: $kind"
              echo
              echo 'No automatic source-code modifications or skipped tests were attempted.'
              echo 'Please review the logs and submit a tested corrective pull request.'
            } > diagnostics/issue.md
            gh issue create --title "$title" --body-file diagnostics/issue.md
          else
            echo "Issue already recorded; avoiding duplicate."
          fi
      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-diagnosis-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: diagnostics/
          retention-days: 7
          if-no-files-found: ignore
