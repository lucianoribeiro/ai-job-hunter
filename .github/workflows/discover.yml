name: Discover QA jobs

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: qa-job-discovery
  cancel-in-progress: false

jobs:
  discover:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Fetch and rank
        run: python -m src.hunter
      - name: Build review pipeline
        run: python -m src.review
      - name: Generate dashboard
        run: python -m src.dashboard
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: qa-job-reports
          path: |
            data/jobs.csv
            data/report.md
            data/applications.md
            data/history.json
            data/applications.json
            data/dashboard.html
      - name: Persist reports and review history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.csv data/report.md data/applications.md data/history.json data/applications.json data/dashboard.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh QA opportunity and review reports"
            git push
          fi

  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Synthetic smoke test
        run: |
          mkdir -p data
          python - <<'PY'
          import csv
          from src.hunter import FIELDS
          with open('data/jobs.csv', 'w', newline='', encoding='utf-8') as fp:
              out = csv.DictWriter(fp, fieldnames=FIELDS)
              out.writeheader()
              out.writerow({'score': 90, 'category': 'freelance', 'title': 'Senior QA Lead',
                            'company': 'Synthetic Example', 'location': 'Worldwide',
                            'salary': 'USD 60/hour', 'type': 'Contract',
                            'remote': True, 'usd_confirmed': True,
                            'url': 'https://example.com/synthetic-job', 'source': 'test'})
          PY
          python -m src.review
          python -m src.dashboard
          test -s data/dashboard.html
          test -s data/applications.json
          grep -q 'Senior QA Lead' data/dashboard.html
      - name: Discover project jobs from real employer public board
        run: |
          python -m src.project_jobs_poc --config config/project_boards.example.json --output data/project_jobs_poc.json
          python -m src.project_jobs_dashboard --input data/project_jobs_poc.json --output data/project_jobs_poc.html
      - name: Upload real project jobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-jobs-real-results
          path: |
            data/project_jobs_poc.json
            data/project_jobs_poc.html
          if-no-files-found: warn
