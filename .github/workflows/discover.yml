name: Discover QA jobs

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: qa-job-discovery
  cancel-in-progress: false

jobs:
  discover:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Fetch and rank
        run: python -m src.hunter
      - name: Build review pipeline
        run: python -m src.review
      - name: Generate advisory insights
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m src.ai_advisor
      - name: Monitor strategic companies
        run: python -m src.strategic_companies
      - name: Discover today's recruiter posts (best-effort public index)
        run: python -m src.recruiter_monitor
      - name: Retain LinkedIn-indexed recruiter history
        run: python -m src.linkedin_history
      - name: Calculate market intelligence
        run: python -m src.market_intelligence
      - name: Discover hidden job market signals
        run: python -m src.hidden_market
      - name: Generate dashboard
        run: python -m src.dashboard
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: qa-job-reports
          path: |
            data/jobs.csv
            data/report.md
            data/applications.md
            data/history.json
            data/market_insights.json
            data/linkedin_history.json
            data/applications.json
            data/dashboard.html
            data/ai_insights.json
            data/strategic_jobs.json
            data/recruiter_monitor.json
            data/hidden_market.json
            data/hidden_market.html
      - name: Persist reports and review history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.csv data/report.md data/applications.md data/history.json data/applications.json data/dashboard.html data/ai_insights.json data/strategic_jobs.json data/recruiter_monitor.json data/linkedin_history.json data/market_insights.json data/hidden_market.json data/hidden_market.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh QA opportunity and review reports"
            git push
          fi

  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Real hidden-market collection on PR branch
        run: |
          python -m src.hidden_market
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("data/hidden_market.json").read_text())
          print("REAL_COLLECTION_METRICS " + json.dumps({
              "companies_checked": r["companies_checked"],
              "companies_failed": r["companies_failed"],
              "signals": sum(x["signal"] == "engineering_hiring_without_public_qa_listing" for x in r["items"]),
              "evidence_links": sum(len(x["evidence"]) for x in r["items"]),
              "public_qa_openings": r["comparison"]["qa_public_openings"],
              "qa_already_collected": r["comparison"]["qa_already_collected"],
              "qa_not_in_baseline": r["comparison"]["qa_not_in_baseline"]
          }))
          PY
      - name: Upload real hidden-market evidence
        uses: actions/upload-artifact@v4
        with:
          name: real-hidden-market-pr-evidence
          path: |
            data/hidden_market.json
            data/hidden_market.html
          if-no-files-found: error
      - name: Synthetic smoke test
        run: |
          mkdir -p data
          python - <<'PY'
          import csv
          from src.hunter import FIELDS
          with open('data/jobs.csv', 'w', newline='', encoding='utf-8') as fp:
              out = csv.DictWriter(fp, fieldnames=FIELDS)
              out.writeheader()
              out.writerow({'score': 90, 'category': 'freelance', 'title': 'Senior QA Lead',
                            'company': 'Synthetic Example', 'location': 'Worldwide',
                            'salary': 'USD 60/hour', 'type': 'Contract',
                            'remote': True, 'usd_confirmed': True,
                            'url': 'https://example.com/synthetic-job', 'source': 'test'})
          PY
          python -m src.review
          python -m src.ai_advisor
          python -m src.strategic_companies --config config/strategic_companies.test.json
          python -m src.market_intelligence
          python -m src.hidden_market
          python -m src.dashboard
          test -s data/hidden_market.html
          test -s data/dashboard.html
          test -s data/applications.json
          grep -q 'Senior QA Lead' data/dashboard.html
      - name: Upload real project jobs
        if: false # External API probes belong in scheduled integration workflow
        uses: actions/upload-artifact@v4
        with:
          name: project-jobs-real-results
          path: |
            data/project_jobs_poc.json
            data/regional_qa_jobs.json
            data/himalayas_jobs.json
            data/extra_jobs.json
            data/project_jobs_poc.html
            data/unified_jobs.html
            data/jobs.csv
          if-no-files-found: warn
