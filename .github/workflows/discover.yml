name: Discover QA jobs

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write

concurrency:
  group: qa-job-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Fetch and rank
        run: python -m src.hunter
      - name: Build review pipeline
        run: python -m src.review
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: qa-job-reports
          path: |
            data/jobs.csv
            data/report.md
            data/applications.md
            data/history.json
            data/applications.json
      - name: Persist reports and review history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.csv data/report.md data/applications.md data/history.json data/applications.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh QA opportunity and review reports"
            git push
          fi
